[project]
name = "interlude"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "pymysql[rsa]>=1.1,<2",
  "httpx>=0.28,<1", "python-multipart>=0.0.20", "scenedetect[opencv]>=0.6.7,<0.7",
  "silero-vad>=6,<7", "soundfile>=0.13,<1", "pillow>=11,<13",
  "torch>=2.2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["apps/api/interlude"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires configured hosted services"]
[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
