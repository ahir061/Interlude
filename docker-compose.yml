services:
  migrate:
    build: .
    env_file: .env
    command: python scripts/migrate.py
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/app/data"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    env_file: .env
    command: python -m interlude.worker
    volumes: ["./data:/app/data"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build: ./apps/web
    ports: ["127.0.0.1:3000:3000"]
# MySQL and Qwen remain your existing external services; no new database server.
